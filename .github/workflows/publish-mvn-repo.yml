# Publish: on every push to main, build, test and SAST-check the project, then deploy the Maven
# artifacts (org.tamacat:tomcat-secure-parent / tomcat-secure-embed) to the mvn-repo branch of
# tamacat/tamacat.github.io.
#
# Gates (publish nothing unless all pass): `mvn -Psast clean verify` on JDK 17 (minimum) and the tests
# on JDK 25, each with >= 1 test and 0 failures / errors / skipped tests.
# The publish job deploys the exact files built by verify (checked by SHA-256), only adds the new
# version (released versions are immutable: an existing version is skipped with a warning) and
# refuses any change outside the two artifact directories.
#
# Requires: environment "release" with secret MVN_REPO_PAT (fine-grained token, Contents: read and
# write on tamacat/tamacat.github.io only).
name: Publish to mvn-repo

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.dist.outputs.version }}
      dist-sha256: ${{ steps.dist.outputs.sha256 }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and SAST (JDK 17)
        run: |
          mvn -B -V -Psast clean verify
          mvn -v | head -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Require 0 failures and 0 skipped tests
        run: python3 tools/check-test-reports.py tomcat-secure-embed/target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the Maven files and their SHA-256
        id: dist
        run: |
          v=$(bash tools/collect-dist.sh dist)
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          { echo "- version: ${v}, commit: ${GITHUB_SHA}"; echo '```'; (cd dist && ls -l --time-style=+ * && cat SHA256SUMS); echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether this version is already published
        id: published
        env:
          V: ${{ steps.dist.outputs.version }}
        run: |
          url="https://raw.githubusercontent.com/tamacat/tamacat.github.io/mvn-repo/org/tamacat/tomcat-secure-embed/${V}/tomcat-secure-embed-${V}.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" = 200 ]; then
            echo "::warning::tomcat-secure-embed ${V} is already published; bump the version in pom.xml to publish this commit"
            echo "- ${V} is already published: nothing to publish" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 404 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected HTTP ${code} from ${url}"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  test-latest-jdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test (JDK 25)
        run: |
          mvn -B -V clean verify
          mvn -v | head -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Require 0 failures and 0 skipped tests
        run: python3 tools/check-test-reports.py tomcat-secure-embed/target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [verify, test-latest-jdk]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    concurrency:
      group: publish-mvn-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-dist
          path: dist

      - name: Check the files are the tested ones
        run: |
          [ "$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" = '${{ needs.verify.outputs.dist-sha256 }}' ] \
            || { echo "::error::SHA256SUMS differs from the one verify produced"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Clone mvn-repo (anonymous, partial and sparse; the repository is public)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse --branch mvn-repo --single-branch \
            https://github.com/tamacat/tamacat.github.io.git "$RUNNER_TEMP/mvn-repo"
          git -C "$RUNNER_TEMP/mvn-repo" sparse-checkout set \
            org/tamacat/tomcat-secure-parent org/tamacat/tomcat-secure-embed

      - name: Deploy, check the write scope, commit and push (up to 3 attempts)
        env:
          V: ${{ needs.verify.outputs.version }}
          PAT: ${{ secrets.MVN_REPO_PAT }}
        run: |
          [ -n "$PAT" ] || { echo "::error::secret MVN_REPO_PAT is not set in environment release"; exit 1; }
          repo="$RUNNER_TEMP/mvn-repo"
          auth=$(printf 'x-access-token:%s' "$PAT" | base64 -w0)
          echo "::add-mask::${auth}"
          unset PAT
          git -C "$repo" config user.name "tomcat-custom publish workflow"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Maven runs without the token.
            rc=0
            bash tools/stage-mvn-repo.sh dist "$repo" "$V" > diff.txt || rc=$?
            if [ "$rc" = 3 ]; then
              echo "::warning::${V} was published meanwhile; nothing to do"
              cat diff.txt >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ "$rc" != 0 ]; then
              cat diff.txt; echo "::error::staging failed"; exit 1
            fi
            git -C "$repo" commit -q -m "tomcat-secure-embed ${V} (tamacat/tomcat-custom ${GITHUB_SHA}, run ${GITHUB_RUN_ID})"
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
               git -C "$repo" push origin HEAD:mvn-repo 2> push.err; then
              { echo "- mvn-repo commit: $(git -C "$repo" rev-parse HEAD)"; echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat push.err
            if grep -q -E '(403|401|Authentication failed|Permission)' push.err || [ "$attempt" = 3 ]; then
              echo "::error::push failed"; exit 1
            fi
            sleep $((attempt * 20))
            git -C "$repo" fetch -q --depth 1 --filter=blob:none origin mvn-repo
            git -C "$repo" reset -q --hard FETCH_HEAD
            git -C "$repo" clean -q -fdx
          done
